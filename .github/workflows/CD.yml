name: CD

on:
  push:
    branches:
      - main
      - test_pipeline

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_DEFAULT_REGION: eu-central-1

    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Terraform init
        working-directory: terraform/env/dev
        run: terraform init

      - name: Terraform plan
        working-directory: terraform/env/dev
        run: terraform plan

      - name: terraform apply infrastucture
        working-directory: terraform/env/dev
        run: terraform apply -auto-approve
    
  k8s:
    needs: terraform
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_DEFAULT_REGION: eu-central-1

    steps:
      - uses: actions/checkout@v3
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region eu-central-1 \
            --name dev-cluster

      - name: apply addons
        working-directory: k8s/
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.14.0/deploy/static/provider/cloud/deploy.yaml

      - name: apply namespace
        working-directory: k8s/
        run: kubectl apply -f namespaces.yaml

      # secret tls is created imperatvley to read github secret
      - name: apply base manifests
        working-directory: k8s/
        run: |
          
          kubectl create secret tls tls-secret \
            --cert=<(echo "${{ secrets.TLS_CERT }}") \
            --key=<(echo "${{ secrets.TLS_KEY }}") \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f base/

      - name: apply app manifests
        working-directory: k8s/
        run: kubectl apply -f app/
